services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meditalk
      POSTGRES_USER: meditalk
      POSTGRES_PASSWORD: meditalk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - meditalk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditalk -d meditalk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  meditalk-postgres:
